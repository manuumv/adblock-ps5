name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Test
        run: make test HOST_CC=clang

  ps5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build payload
        run: tools/ps5-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-adblock
          path: build/ps5/ps5-adblock.elf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, ps5]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps5-adblock
      - uses: softprops/action-gh-release@v2
        with:
          files: ps5-adblock.elf
          prerelease: true
