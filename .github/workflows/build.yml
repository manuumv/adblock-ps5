name: build

# Checks every push and pull request. Releases come from deploy.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Test
        run: make test HOST_CC=clang

  ps5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build payload
        run: tools/ps5-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-adblock
          path: build/ps5/ps5-adblock.elf
          if-no-files-found: error

